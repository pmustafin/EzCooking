services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ezcooking
      POSTGRES_USER: ezcooking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ezcooking_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezcooking -d ezcooking"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ezcooking_pg:
